<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Pergunta 09</title>
</head>

<body>
    <script>
        let array20 = [];
        for (let i = 0; i < 20; i++) {
            array20[i] = Math.floor(Math.random() * 100);
        }

        for (let i = 1; i < 20; i++) {
            let chave = array20[i];
            let j = i - 1;

            while (j >= 0 && array20[j] > chave) {
                array20[j + 1] = array20[j];
                j--;
            }

            array20[j + 1] = chave;
        }

        for (let i = 0; i < 20; i++) {
            let cor = (array20[i] % 2 === 0) ? "blue" : "green";
            document.write("<span style='background-color: " + cor + "; color: white; padding: 5px; margin: 2px;'>" + array20[i] + "</span>");
        }
    </script>
</body>

</html>
